name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and component tests
        run: pnpm test

      - name: Run Electron end-to-end tests
        run: pnpm test:e2e

      - name: Upload failed end-to-end results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cd-e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            command: package:win
            artifact: omnidesign-windows-x64
            path: release/*.exe
          - label: macOS Apple Silicon
            os: macos-15
            command: package:mac:arm64
            artifact: omnidesign-macos-arm64
            path: release/*.dmg
          - label: macOS Intel
            os: macos-15-intel
            command: package:mac:x64
            artifact: omnidesign-macos-x64
            path: release/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package application
        run: pnpm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
