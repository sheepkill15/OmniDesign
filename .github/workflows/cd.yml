name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and component tests
        run: pnpm test

      - name: Run Electron end-to-end tests
        run: pnpm test:e2e

      - name: Upload failed end-to-end results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cd-e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            platform: windows
            command: package:win
            artifact: omnidesign-windows-x64
            path: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - label: macOS Apple Silicon
            os: macos-15
            platform: macos
            command: package:mac:arm64
            artifact: omnidesign-macos-arm64
            path: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
          - label: macOS Intel
            os: macos-15-intel
            platform: macos
            command: package:mac:x64
            artifact: omnidesign-macos-x64
            path: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        run: pnpm version "0.0.${{ github.run_number }}" --no-git-tag-version

      - name: Package Windows application
        if: matrix.platform == 'windows'
        run: pnpm run ${{ matrix.command }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package macOS application
        if: matrix.platform == 'macos'
        run: node scripts/package-macos.mjs ${{ matrix.command }}
        env:
          OMNIDESIGN_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          OMNIDESIGN_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          OMNIDESIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          OMNIDESIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          OMNIDESIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub update
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Require macOS release credentials
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::GitHub Release publication requires macOS signing and notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packaged applications
        uses: actions/download-artifact@v7
        with:
          pattern: omnidesign-*
          path: downloaded-artifacts

      - name: Prepare architecture-aware update metadata
        run: pnpm release:prepare -- downloaded-artifacts release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 0.0.${{ github.run_number }}
        run: gh release create "v${RELEASE_VERSION}" release-assets/* --target "${GITHUB_SHA}" --title "OmniDesign ${RELEASE_VERSION}" --generate-notes --latest
