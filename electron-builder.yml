appId: dev.omnidesign.app
productName: OmniDesign
asar: true

directories:
  output: release

files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
